/*
 * fonts.css : les polices.
 * Deux graisses de Montserrat seulement : Regular 400 et Bold 700.
 * (La graisse Light n'est pas utilisée : son fichier reste dans le dépôt, sans être déclaré.)
 * Les fichiers sont intégrés à la page par le build : aucune police n'est chargée depuis un site extérieur.
 */

/* Les deux polices utilisées dans toute la page (réglages en un seul endroit). */
:root {
  --font-text: "Montserrat", sans-serif;
  /* Exception voulue à la charte : police à chasse fixe du système, pour les formules. */
  --font-code: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/*
 * theme.css : les couleurs, et SEULEMENT les couleurs.
 * Treize jetons (docs/ux/regles-visuelles.md, partie 2). C'est le seul fichier
 * où une couleur est écrite en toutes lettres : les autres fichiers utilisent var(--nom).
 * Le mode clair est la valeur de base ; le mode sombre s'active quand theme.js
 * pose l'attribut data-theme="dark" sur la page (tâche 1.20).
 */

/* Mode clair */
:root {
  --page-background: #FFFFFF;        /* fond de la page (blanc) */
  --card-background: #FFFFFF;        /* fond d'une fiche (blanc) */
  --text-primary: #090C0B;           /* textes importants (noir) */
  --text-secondary: #59736E;         /* sous-titre et informations secondaires (gris-vert) */
  --border: #59736E;                 /* bordures de fiche, de code, d'information, de champ, traits de séparation (gris-vert) */
  --outline-strong: #090C0B;         /* bordure épaisse d'erreur et contour de focus (noir) */
  --code-background: #FFFFFF;        /* fond du bloc de code (blanc, comme la fiche : sa bordure le distingue) */
  --code-accent: #44F8CC;            /* filet décoratif à gauche du bloc de code (turquoise) */
  --card-header-background: #59736E; /* fond du bandeau du titre de fiche (gris-vert) */
  --card-header-text: #F3F6F6;       /* texte du titre de fiche, posé sur le bandeau (gris très clair) */
  --logo-zone-background: #FFFFFF;   /* zone autour du logo (blanc dans les deux modes) */
  --accent: #F77245;                 /* accent, décoration seulement (orange) */
  --menu-selected-background: #F3F6F6; /* fond de l'élément sélectionné du menu (gris très clair) */
}

/* Mode sombre */
:root[data-theme="dark"] {
  --page-background: #090C0B;        /* noir */
  --card-background: #090C0B;        /* noir : la fiche se distingue par sa bordure */
  --text-primary: #F3F6F6;           /* gris très clair */
  --text-secondary: #F3F6F6;         /* gris très clair (le gris-vert n'est pas lisible sur noir) */
  --border: #59736E;                 /* gris-vert */
  --outline-strong: #F3F6F6;         /* gris très clair */
  --code-background: #090C0B;        /* noir, comme la fiche : sa bordure le distingue ; le bandeau gris-vert reste le seul aplat (décidé le 25/11/2026) */
  --code-accent: #44F8CC;            /* turquoise (identique au mode clair) */
  --card-header-background: #59736E; /* gris-vert (identique au mode clair) */
  --card-header-text: #F3F6F6;       /* gris très clair (identique au mode clair) */
  --logo-zone-background: #FFFFFF;   /* blanc : le logo n'a pas de version blanche */
  --accent: #F77245;                 /* orange */
  --menu-selected-background: #59736E; /* gris-vert (à valider à l'écran, tâche 1.36) */
}

/*
 * layout.css : la mise en page (tailles, espaces, bordures, losanges, deux colonnes, petit écran).
 * Les valeurs viennent de docs/ux/page-deux-colonnes.md (la fiche de la page à deux colonnes),
 * de docs/ux/regles-visuelles.md (parties 5, 6, 7, 8) et de docs/ux/ecran-fiches.md.
 * Les couleurs viennent de theme.css (var(--...)) : aucune couleur n'est écrite ici.
 * Unités en rem (1 rem = 16 px), sauf les deux seuils de petit écran (en px) à la fin du fichier.
 */

/* ---------- Réglages : tout ce qui peut changer est ici ---------- */
:root {
  /* Graisses (Montserrat Regular et Bold seulement) */
  --weight-regular: 400;
  --weight-bold: 700;

  /* Tailles de texte */
  --size-page-title: 1.5rem;    /* 24 px */
  --size-subtitle: 1rem;        /* 16 px */
  --size-group-title: 1.25rem;  /* 20 px */
  --size-card-title: 1rem;      /* 16 px */
  --size-text: 0.875rem;        /* 14 px : valeurs, messages, menu, champ, ligne de contexte */
  --size-small: 0.8125rem;      /* 13 px (plancher) : étiquettes, informations secondaires, code, « Sommaire », bouton « Effacer » */

  /* Hauteurs de ligne */
  --line-title: 1.2;
  --line-group-title: 1.25;
  --line-compact: 1.3;          /* titre de fiche, étiquette, éléments du menu, boutons */
  --line-secondary: 1.4;        /* sous-titre et informations secondaires */
  --line-text: 1.5;             /* valeurs, code et messages */

  /* Page à deux colonnes */
  --page-margin: 1.5rem;            /* 24 px (16 px sous 600 px) */
  --sidebar-width: 15rem;           /* 240 px au total : trait et marge de 20 px compris */
  --sidebar-padding-right: 1.25rem; /* 20 px entre le contenu de la colonne et le trait */
  --column-gap: 1.5rem;             /* 24 px entre le trait et le contenu */
  --sidebar-gap: 1.5rem;            /* 24 px sous le logo (valeur reprise de l'ancien écart logo-texte : la fiche n'en donne pas) */

  /* Bordures et coins */
  --border-width: 0.0625rem;        /* 1 px */
  --border-width-strong: 0.125rem;  /* 2 px */
  --corner-radius: 0.25rem;         /* 4 px */

  /* Contour de focus (regles-visuelles.md, partie 8) : 2 px plein, 2 px d'écart */
  --focus-width: 0.125rem;
  --focus-offset: 0.125rem;

  /* Titre et sous-titre */
  --title-subtitle-gap: 0.5rem;     /* 8 px entre le titre et le sous-titre */
  --title-diamonds-gap: 1.5rem;     /* 24 px entre le texte et la zone des grands losanges */
  /* 122 px à droite (8 + 90 + 24) : le texte ne passe jamais sous les grands losanges (0 sous 800 px).
     Calculée à partir des réglages des losanges (plus bas dans ce fichier). */
  --title-right-margin: calc(var(--big-diamonds-right) + var(--big-diamonds-width) + var(--title-diamonds-gap));

  /* Logo */
  --logo-width: 8.75rem;            /* 140 px (110 px sous 600 px) */
  --logo-margin: 1.25rem;           /* 20 px de marge vide dans la zone blanche */
  --logo-radius: 0.5rem;            /* 8 px : coins arrondis de la zone blanche (le logo lui-même n'est jamais modifié) */
  /* Retrait à gauche pour centrer la zone blanche dans la colonne de 240 px (au-dessus de 800 px) :
     (240 - (140 + 2 × 20)) / 2 = 30 px de chaque côté. Calculé à partir des réglages ci-dessus. */
  --logo-offset-left: calc((var(--sidebar-width) - var(--logo-width) - 2 * var(--logo-margin)) / 2);

  /* Menu « Sommaire » (colonne de gauche) */
  --menu-title-gap: 0.5rem;         /* 8 px sous le petit titre */
  --menu-item-gap: 0.25rem;         /* 4 px entre deux éléments */
  --menu-item-padding-y: 0.5rem;    /* 8 px en haut et en bas d'un élément */
  --menu-item-padding-x: 0.75rem;   /* 12 px de chaque côté */
  --menu-item-inner-gap: 0.5rem;    /* 8 px : losange - nom, et écart minimal nom - nombre */
  --menu-diamond-size: 0.5rem;      /* 8 px : côté du carré avant rotation */
  --menu-focus-room: 0.25rem;       /* 4 px : place du contour de focus autour de la liste qui défile */

  /* Champ de recherche, liste déroulante, bande de recherche collée */
  --control-height: 2.25rem;        /* 36 px */
  --control-padding-x: 0.75rem;     /* 12 px à gauche et à droite */
  --search-max-width: 40rem;        /* 640 px */
  --bar-air-top: 0.25rem;           /* 4 px d'air au-dessus du champ (pour le contour de focus) */
  --bar-air-bottom: 0.9375rem;      /* 15 px d'air sous le champ, avant le trait */
  --bar-space-above: 0.75rem;       /* 12 px entre le sous-titre et la bande (ou entre le sous-titre et la liste déroulante : la fiche n'en donne pas) */
  --bar-space-below: 1rem;          /* 16 px sous le trait */
  --sticky-offset: 4.5rem;          /* 72 px : marge de défilement (bande de 56 px + 16 px) ; 4 px quand la bande n'est pas collée (voir le seuil de 800 px) */

  /* Ligne de contexte et bouton « Effacer la recherche » */
  --context-gap: 0.75rem;           /* 12 px : sous la ligne, et entre le texte et le bouton */
  --clear-padding-y: 0.25rem;       /* 4 px */
  --clear-padding-x: 0.625rem;      /* 10 px */

  --label-gap: 0.25rem;             /* 4 px entre une étiquette et sa valeur (blocs, et « Catégorie : » sous 800 px) */

  /* Groupes et fiches */
  --group-gap: 1.5rem;              /* 24 px entre deux catégories */
  --group-title-gap: 0.75rem;      /* 12 px entre un titre de catégorie et sa première fiche */
  --card-gap: 0.75rem;             /* 12 px entre deux fiches */
  --card-padding: 0.75rem;         /* 12 px de marge intérieure */
  --card-header-padding-y: 0.5rem;  /* 8 px : marge intérieure du bandeau, en haut et en bas */
  --card-header-gap: 0.5rem;         /* 8 px sous le bandeau, avant la ligne d'informations ou les blocs */
  /* Rayon des coins du bandeau : celui de la fiche moins sa bordure (4 px - 1 px = 3 px) */
  --card-header-radius: calc(var(--corner-radius) - var(--border-width));
  --block-gap: 0.5rem;              /* 8 px entre deux blocs */
  --meta-blocks-gap: 0.75rem;       /* 12 px entre la ligne d'informations et les blocs (inchangé) */
  --meta-item-gap: 1.5rem;          /* 24 px à droite de chaque information secondaire */
  --code-padding: 0.625rem;        /* 10 px de marge intérieure du bloc de code */
  --code-accent-width: 0.25rem;     /* 4 px : filet décoratif à gauche du bloc de code */

  /* Messages */
  --message-padding: 1rem;          /* 16 px de marge intérieure */
  --message-line-gap: 0.5rem;       /* 8 px entre les deux lignes */

  /* Losange plein devant un titre de catégorie */
  --title-diamond-size: 0.75rem;    /* 12 px de côté */
  --title-diamond-gap: 0.75rem;     /* 12 px d'écart avec le texte */

  /* Les deux grands losanges en contour, à droite du titre : une zone de 90 px sur 75 px,
     à 8 px du bord droit du contenu et 8 px AU-DESSUS du haut du contenu (le haut du titre).
     Chaque losange est placé dans cette zone. */
  --big-diamond-size: 2.25rem;          /* 36 px de côté (avant rotation) */
  --big-diamonds-width: 5.625rem;       /* 90 px : largeur de la zone (sa hauteur est de 75 px) */
  --big-diamonds-right: 0.5rem;         /* 8 px : zone, depuis le bord droit */
  --big-diamonds-top: -0.5rem;          /* -8 px : zone, au-dessus du haut du contenu */
  --big-diamond-one-right: 2.0625rem;   /* 33 px : premier losange, depuis le bord droit de la zone */
  --big-diamond-one-top: 0.625rem;      /* 10 px : premier losange, depuis le haut de la zone */
  --big-diamond-two-right: 0.5625rem;   /* 9 px : second losange, depuis le bord droit de la zone */
  --big-diamond-two-top: 1.375rem;      /* 22 px : second losange, depuis le haut de la zone */
  --diamond-turn: 45deg;                /* chaque carré est tourné pour devenir un losange */
}

/* ---------- La page ---------- */

/* Fond et couleur du texte toujours définis ENSEMBLE. Les mots très longs passent à la ligne.
   Deux colonnes : la colonne de gauche (240 px au total), un écart, puis le contenu sur TOUTE
   la largeur restante (minmax(0, 1fr) : une valeur longue ne fait jamais déborder la page).
   Aucun parent n'a de overflow ni de hauteur fixe : le menu et la bande de recherche peuvent être collés. */
body {
  display: grid;
  grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
  column-gap: var(--column-gap);
  margin: 0;
  padding: var(--page-margin);
  background: var(--page-background);
  color: var(--text-primary);
  font-family: var(--font-text);
  font-size: var(--size-text);
  font-weight: var(--weight-regular);
  line-height: var(--line-text);
  overflow-wrap: anywhere;
}

/* Contour de focus : le même sur tout élément interactif (lien d'évitement, boutons du menu,
   liste déroulante, champ, bouton « Effacer ») et sur la zone de contenu quand elle reçoit le
   focus au clavier par le lien d'évitement (:focus-visible : jamais au clic de souris).
   Jamais turquoise ni orange. Aucun « outline: none » dans ce fichier. */
:focus-visible {
  outline: var(--focus-width) solid var(--outline-strong);
  outline-offset: var(--focus-offset);
}

/* ---------- Lien d'évitement et annonce aux lecteurs d'écran ---------- */

/* Masquage visuel (PAS display: none ni visibility: hidden, qui les retireraient) : le lien
   reste dans l'ordre de Tab et l'annonce reste lue par les lecteurs d'écran. Le lien n'est masqué
   que tant qu'il n'a pas le focus. */
.skip-link:not(:focus),
.announce-zone {
  position: absolute;
  width: 0.0625rem;
  height: 0.0625rem;
  margin: -0.0625rem;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  clip-path: inset(50%);
  white-space: nowrap;
}

/* Lien d'évitement visible (il a le focus) : en haut à gauche, PAR-DESSUS le contenu, sur un fond
   opaque, avec les valeurs d'un élément du menu. Texte et fond sont définis ensemble. */
.skip-link {
  position: fixed;
  top: var(--page-margin);
  left: var(--page-margin);
  z-index: 2;
  padding: var(--menu-item-padding-y) var(--menu-item-padding-x);
  background: var(--page-background);
  color: var(--text-primary);
  border-radius: var(--corner-radius);
  font-size: var(--size-text);
  font-weight: var(--weight-bold);
  line-height: var(--line-compact);
}

/* ---------- La colonne de gauche ---------- */

/* Le trait vertical d'1 px est le bord droit de la colonne ; la colonne s'étire sur toute la
   hauteur de la page. Seul le menu est collé (le logo défile avec la page). */
.sidebar {
  padding-right: var(--sidebar-padding-right);
  border-right: var(--border-width) solid var(--border);
}

/* Zone blanche (dans les deux modes) avec sa marge vide autour du logo. */
.sidebar-logo {
  width: fit-content;
  margin: 0 0 var(--sidebar-gap) var(--logo-offset-left); /* centrée dans la colonne de 240 px (remise à 0 sous 800 px) */
  padding: var(--logo-margin);
  background: var(--logo-zone-background);
  border-radius: var(--logo-radius); /* coins arrondis de 8 px, plus petits que la marge de 20 px : le logo n'est pas coupé */
}

/* Largeur fixe, hauteur automatique : le logo n'est jamais déformé, recoloré ni rogné. */
.sidebar-logo img {
  display: block;
  width: var(--logo-width);
  height: auto;
}

/* Le menu est collé en haut de la fenêtre (à la marge de la page) et défile à l'intérieur de
   lui-même s'il est plus haut que la fenêtre. Sa marge intérieure de 4 px, compensée par la même
   marge négative, laisse la place au contour de focus (2 px + 2 px d'écart) : il n'est jamais coupé. */
.menu {
  position: sticky;
  top: calc(var(--page-margin) - var(--menu-focus-room));
  max-height: calc(100vh - 2 * var(--page-margin));
  margin: calc(-1 * var(--menu-focus-room));
  padding: var(--menu-focus-room);
  overflow-y: auto;
}

/* Petit titre : ce n'est pas un titre de page, juste le nom visible du menu. */
.menu-title {
  margin: 0 0 var(--menu-title-gap);
  color: var(--text-secondary);
  font-size: var(--size-small);
  font-weight: var(--weight-bold);
  line-height: var(--line-compact);
}

/* Liste sans puce, sans marge ni retrait par défaut. */
.menu-list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.menu-item {
  margin: 0;
  padding: 0;
}

.menu-item + .menu-item {
  margin-top: var(--menu-item-gap);
}

/* Chaque élément est un bouton : on remet à zéro ce que le navigateur ajoute (police, couleur,
   bordure, alignement), puis on applique les valeurs de la fiche. Fond et texte définis ensemble. */
.menu-button {
  display: flex;
  align-items: flex-start;
  gap: var(--menu-item-inner-gap);
  width: 100%;
  margin: 0;
  padding: var(--menu-item-padding-y) var(--menu-item-padding-x);
  background: var(--page-background);
  color: var(--text-primary);
  border: 0;
  border-radius: var(--corner-radius);
  font-family: inherit;
  font-size: var(--size-text);
  font-weight: var(--weight-regular);
  line-height: var(--line-compact);
  text-align: left;
}

/* Petit losange de 8 px : sa place est TOUJOURS réservée (le texte ne bouge pas), il est
   invisible tant que l'élément n'est pas sélectionné. Décoratif : rien d'écrit dedans.
   Il est centré sur la première ligne du texte. */
.menu-button::before {
  content: "";
  flex: none;
  width: var(--menu-diamond-size);
  height: var(--menu-diamond-size);
  margin-top: calc((var(--size-text) * var(--line-compact) - var(--menu-diamond-size)) / 2);
  background: var(--accent);
  transform: rotate(var(--diamond-turn));
  visibility: hidden;
}

/* Le nom passe à la ligne s'il est long. */
.menu-item-name {
  flex: 1 1 auto;
  min-width: 0;
}

/* Sans résultat (pendant une recherche seulement) : le nom ET le nombre sont en text-secondary.
   Sur l'élément sélectionné, seule la couleur du texte change (fond, Bold et losange restent). */
.menu-button-empty,
.menu-button-empty .menu-item-count {
  color: var(--text-secondary);
}

/* Le nombre reste à droite et en haut de l'élément, en Regular. */
.menu-item-count {
  flex: none;
  color: var(--text-secondary);
  font-weight: var(--weight-regular);
}

/* Élément sélectionné : fond propre, texte Bold, losange orange plein. */
.menu-button[aria-current="true"] {
  background: var(--menu-selected-background);
}

.menu-button[aria-current="true"] .menu-item-name {
  font-weight: var(--weight-bold);
}

.menu-button[aria-current="true"]::before {
  visibility: visible;
}

/* ---------- Le haut du contenu ---------- */

/* Le contenu sert de repère de position pour les deux grands losanges et pour la zone d'annonce. */
main {
  position: relative;
}

.page-title {
  margin: 0 var(--title-right-margin) 0 0;
  font-size: var(--size-page-title);
  font-weight: var(--weight-bold);
  line-height: var(--line-title);
}

.page-subtitle {
  margin: var(--title-subtitle-gap) var(--title-right-margin) 0 0;
  color: var(--text-secondary);
  font-size: var(--size-subtitle);
  font-weight: var(--weight-regular);
  line-height: var(--line-secondary);
}

/* Les deux grands losanges en contour, à droite du titre : décoration en CSS seulement, sans texte,
   jamais ciblés par le clavier. Ils défilent avec le titre. */
main::before,
main::after {
  content: "";
  position: absolute;
  box-sizing: border-box;
  width: var(--big-diamond-size);
  height: var(--big-diamond-size);
  border: var(--border-width-strong) solid var(--accent);
  transform: rotate(var(--diamond-turn));
}

main::before {
  top: calc(var(--big-diamonds-top) + var(--big-diamond-one-top));
  right: calc(var(--big-diamonds-right) + var(--big-diamond-one-right));
}

main::after {
  top: calc(var(--big-diamonds-top) + var(--big-diamond-two-top));
  right: calc(var(--big-diamonds-right) + var(--big-diamond-two-right));
}

/* Liste déroulante « Catégorie : » : retirée au-dessus de 800 px (le menu de la colonne de gauche
   la remplace) ; affichée sous 800 px (voir le seuil en bas du fichier). */
.category-picker {
  display: none;
  margin-top: var(--bar-space-above);
}

.category-label {
  display: block;
  margin-bottom: var(--label-gap);
  font-size: var(--size-text);
  font-weight: var(--weight-bold);
  line-height: var(--line-compact);
}

/* Même apparence que le champ de recherche. Fond et texte définis ensemble. */
.menu-select {
  display: block;
  box-sizing: border-box;
  width: 100%;
  height: var(--control-height);
  padding: 0 var(--control-padding-x);
  background: var(--page-background);
  color: var(--text-primary);
  border: var(--border-width) solid var(--border);
  border-radius: var(--corner-radius);
  font-family: inherit;
  font-size: var(--size-text);
  font-weight: var(--weight-regular);
}

/* Bande de recherche COLLÉE en haut du contenu (56 px : 4 + 36 + 15 + trait d'1 px), au-dessus des
   fiches, sur un fond opaque. Le titre, les losanges et la ligne de contexte défilent avec les fiches. */
.search-bar {
  position: sticky;
  top: 0;
  z-index: 1;
  margin: var(--bar-space-above) 0 var(--bar-space-below);
  padding: var(--bar-air-top) 0 var(--bar-air-bottom);
  background: var(--page-background);
  border-bottom: var(--border-width) solid var(--border);
}

.search-input {
  display: block;
  box-sizing: border-box;
  width: 100%;
  max-width: var(--search-max-width);
  height: var(--control-height);
  margin: 0;
  padding: 0 var(--control-padding-x);
  background: var(--page-background);
  color: var(--text-primary);
  border: var(--border-width) solid var(--border);
  border-radius: var(--corner-radius);
  font-family: inherit;
  font-size: var(--size-text);
  font-weight: var(--weight-regular);
  -webkit-appearance: none;
  appearance: none;
}

/* Texte d'aide en text-secondary (sans transparence : Firefox en ajoute une par défaut). */
.search-input::placeholder {
  color: var(--text-secondary);
  opacity: 1;
}

/* La petite croix native est masquée : « Effacer la recherche » et la touche Échap la remplacent. */
.search-input::-webkit-search-cancel-button {
  -webkit-appearance: none;
  appearance: none;
  display: none;
}

/* La marge de défilement évite que la bande collée cache la zone de contenu ou le bouton « Effacer »
   quand ils reçoivent le focus ou qu'on y arrive par le lien d'évitement. */
#content-zone,
.clear-button {
  scroll-margin-top: var(--sticky-offset);
}

/* ---------- La ligne de contexte ---------- */

/* Texte, puis (pendant une recherche avec résultats) le bouton « Effacer la recherche » sur la même ligne. */
.context-zone {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--context-gap);
  margin: 0 0 var(--context-gap);
}

/* Zone vide : aucun espace. */
.context-zone:empty {
  margin: 0;
}

.context-text {
  min-width: 0;
  margin: 0;
  color: var(--text-primary);
  font-size: var(--size-text);
  font-weight: var(--weight-bold);
  line-height: var(--line-text);
}

/* Bouton secondaire : fond page-background, bordure border, texte text-primary, ensemble. */
.clear-button {
  margin: 0;
  padding: var(--clear-padding-y) var(--clear-padding-x);
  background: var(--page-background);
  color: var(--text-primary);
  border: var(--border-width) solid var(--border);
  border-radius: var(--corner-radius);
  font-family: inherit;
  font-size: var(--size-small);
  font-weight: var(--weight-regular);
  line-height: var(--line-compact);
}

/* Dans le message « Aucune fiche… » : le bouton passe sous le texte (espace entre deux lignes d'un message). */
.message .clear-button {
  display: block;
  margin-top: var(--message-line-gap);
}

/* ---------- Les groupes et les fiches ---------- */

.group + .group {
  margin-top: var(--group-gap);
}

.group-title {
  margin: 0 0 var(--group-title-gap);
  font-size: var(--size-group-title);
  font-weight: var(--weight-bold);
  line-height: var(--line-group-title);
}

/* Petit losange plein devant le titre : décoration en CSS seulement, sans texte. */
.group-title::before {
  content: "";
  display: inline-block;
  width: var(--title-diamond-size);
  height: var(--title-diamond-size);
  margin-right: var(--title-diamond-gap);
  background: var(--accent);
  vertical-align: middle;
  transform: rotate(var(--diamond-turn));
}

.card {
  padding: var(--card-padding);
  background: var(--card-background);
  color: var(--text-primary);
  border: var(--border-width) solid var(--border);
  border-radius: var(--corner-radius);
}

.card + .card {
  margin-top: var(--card-gap);
}

/* Titre de fiche = bandeau. Les marges négatives annulent la marge intérieure de la fiche
   en haut, à gauche et à droite : le bandeau va jusqu'à la bordure (il ne la recouvre pas).
   Texte et fond sont définis ensemble. */
.card-title {
  margin: calc(-1 * var(--card-padding)) calc(-1 * var(--card-padding)) var(--card-header-gap);
  padding: var(--card-header-padding-y) var(--card-padding);
  background: var(--card-header-background);
  color: var(--card-header-text);
  border-radius: var(--card-header-radius) var(--card-header-radius) 0 0;
  font-size: var(--size-card-title);
  font-weight: var(--weight-bold);
  line-height: var(--line-compact);
}

/* Titre seul dans la fiche : le bandeau occupe toute la fiche (sa marge du bas annule
   la marge intérieure de la fiche) et ses quatre coins suivent ceux de la fiche. */
.card-title:only-child {
  margin-bottom: calc(-1 * var(--card-padding));
  border-radius: var(--card-header-radius);
}

/* Ligne d'informations secondaires : elle passe à la ligne, sans défilement.
   L'espace au-dessus (8 px) vient du bandeau. */
.meta {
  margin: 0;
  color: var(--text-secondary);
  font-size: var(--size-small);
  line-height: var(--line-secondary);
}

/* Chaque information est séparée de la suivante, en plus de l'espace du texte. */
.meta-item {
  display: inline-block;
  margin-right: var(--meta-item-gap);
}

.meta-item:last-child {
  margin-right: 0;
}

/* ---------- Les blocs ---------- */

/* Liste de description : on retire les marges par défaut du navigateur. */
.blocks {
  margin: var(--meta-blocks-gap) 0 0;
}

/* Juste après le bandeau, l'espace est celui du bandeau (8 px), pas celui de la ligne d'informations (12 px). */
.card-title + .blocks {
  margin-top: 0;
}

.block {
  margin: 0;
}

.block + .block {
  margin-top: var(--block-gap);
}

.block-label {
  margin: 0 0 var(--label-gap);
  font-size: var(--size-small);
  font-weight: var(--weight-bold);
  line-height: var(--line-compact);
}

/* Les retours à la ligne des valeurs sont conservés ; les mots très longs passent à la ligne. */
.block-value {
  margin: 0;
  font-size: var(--size-text);
  font-weight: var(--weight-regular);
  line-height: var(--line-text);
  white-space: pre-wrap;
}

/* Bloc de code : jamais de défilement, le texte passe à la ligne même au milieu d'un mot. */
.block-code {
  margin: 0;
  padding: var(--code-padding);
  background: var(--code-background);
  color: var(--text-primary);
  border: var(--border-width) solid var(--border);
  border-left: var(--code-accent-width) solid var(--code-accent); /* filet décoratif à gauche */
  border-radius: var(--corner-radius);
  font-family: var(--font-code);
  font-size: var(--size-small);
  font-weight: var(--weight-regular);
  line-height: var(--line-text);
  white-space: pre-wrap;
}

/* ---------- Les messages ---------- */

/* Une zone vide n'a ni bordure ni espace : on ne style que la zone qui a du contenu. */
#status-zone:not(:empty),
#alert-zone:not(:empty) {
  padding: var(--message-padding);
  background: var(--page-background);
  color: var(--text-primary);
  border-radius: var(--corner-radius);
  font-size: var(--size-text);
  line-height: var(--line-text);
}

/* Information : bordure fine. */
#status-zone:not(:empty) {
  border: var(--border-width) solid var(--border);
}

/* Erreur : bordure épaisse, sans icône (elle se reconnaît à ses mots et à sa bordure). */
#alert-zone:not(:empty) {
  border: var(--border-width-strong) solid var(--outline-strong);
}

.message {
  margin: 0;
}

.message + .message {
  margin-top: var(--message-line-gap);
}

/* Seconde ligne du message de colonne absente : plus petite. */
.message-detail {
  color: var(--text-secondary);
  font-size: var(--size-small);
}

/* ---------- Pendant un message d'état : menu, « Catégorie : » et recherche retirés ----------
   Quand la zone d'état OU la zone d'alerte n'est pas vide (attente, table vide, colonne absente,
   problème de lecture), il n'y a aucune fiche à parcourir ni à chercher (docs/ux/page-deux-colonnes.md,
   partie 5). La page le sait déjà : render.js vide ces deux zones quand les fiches sont affichées.
   :has() permet de regarder ces deux zones depuis le body, qui contient à la fois la colonne de gauche
   (le menu) et le contenu (liste déroulante et bande de recherche) : aucun JavaScript, aucun attribut.
   display: none retire aussi les éléments du clavier et des lecteurs d'écran.
   Le message « Aucune fiche ne correspond… » est dans la zone des fiches, pas dans ces deux zones :
   il ne déclenche rien, le menu et la recherche restent là.
   Ces règles sont HORS des deux seuils de petit écran (en bas du fichier) et passent devant leurs règles display (.menu, .category-picker,
   .search-bar) par leur poids : #identifiant + :not(:empty) dans :has() + une classe = plus lourd que
   n'importe quelle règle d'une seule classe, quel que soit l'ordre dans le fichier. */
body:has(#status-zone:not(:empty), #alert-zone:not(:empty)) :is(.menu, .category-picker, .search-bar) {
  display: none;
}

/* Le trait d'1 px sous le haut du contenu reste (la fiche le garde, partie 5) : il appartenait à la
   bande de recherche, qui disparaît ; le sous-titre le porte donc pendant un message d'état.
   16 px au-dessus du trait et 16 px en dessous, comme dans la bande. Sa couleur est celle de la bande. */
body:has(#status-zone:not(:empty), #alert-zone:not(:empty)) .page-subtitle {
  margin-bottom: var(--bar-space-below);
  padding-bottom: var(--bar-space-below);
  border-bottom: var(--border-width) solid var(--border);
}

/* ---------- Petit écran : DEUX seuils, chacun écrit UNE SEULE FOIS ----------
   La largeur est celle de la zone du widget dans Grist, pas celle de l'écran.
   Seuil de 800 px (la DISPOSITION) : sous 800 px, une seule colonne. La colonne de gauche n'a plus
   de trait ni de menu collé ; le menu en boutons est retiré (display: none : un seul rendu du menu
   est exposé aux lecteurs d'écran et au clavier) et la liste déroulante « Catégorie : » le remplace ;
   le logo reste au-dessus du titre ; les grands losanges et la marge à droite du titre disparaissent ;
   la bande de recherche n'est plus collée et prend toute la largeur. */
@media (width < 800px) {
  :root {
    --title-right-margin: 0rem;
    --sticky-offset: calc(var(--focus-width) + var(--focus-offset)); /* 4 px : le contour de focus n'est pas coupé en haut */
  }

  body {
    grid-template-columns: minmax(0, 1fr);
  }

  .sidebar {
    padding-right: 0;
    border-right: 0;
  }

  /* Le logo reste aligné à gauche, au-dessus du titre (plus de centrage). */
  .sidebar-logo {
    margin-left: 0;
  }

  .menu {
    display: none;
  }

  .category-picker {
    display: block;
  }

  main::before,
  main::after {
    display: none;
  }

  .search-bar {
    position: static;
  }

  .search-input {
    max-width: none;
  }
}

/* Seuil de 600 px (les MARGES et le LOGO) : sous 600 px, marges de la page de 16 px et logo de 110 px. Rien d'autre. */
@media (width < 600px) {
  :root {
    --page-margin: 1rem;
    --logo-width: 6.875rem;
  }
}

</style>
